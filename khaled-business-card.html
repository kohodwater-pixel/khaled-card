<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خالد الشاعر - Imagine More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2350;
    --navy-deep: #0A1938;
    --teal: #1FB6C9;
    --green: #2FA766;
    --blue: #2E6FE0;
    --orange: #F5A623;
    --grad: linear-gradient(90deg, var(--teal), var(--green), var(--blue), var(--orange));
    --ink: #16264F;
    --muted: #7C879C;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #EEF1F6;
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 28px 14px 48px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(15, 35, 80, 0.14);
    position: relative;
  }
  .header {
    padding: 22px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header img {
    width: 100%;
    max-width: 300px;
    height: auto;
    display: block;
  }
  .avatar-wrap {
    display: flex;
    justify-content: center;
    padding: 6px 0 4px;
  }
  .avatar-ring {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    padding: 4px;
    background: var(--grad);
  }
  .avatar-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #fff;
  }
  .identity {
    text-align: center;
    padding: 14px 20px 6px;
  }
  .identity .name-ar {
    font-size: 26px;
    font-weight: 900;
    color: var(--navy);
  }
  .identity .name-en {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 2px;
  }
  .divider {
    height: 3px;
    width: 80px;
    margin: 14px auto;
    border-radius: 3px;
    background: var(--grad);
  }
  .role-ar {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .role-en {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .actions {
    padding: 18px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 18px;
    border-radius: 14px;
    text-decoration: none;
    font-family: 'Tajawal', sans-serif;
    border: none;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
  }
  .btn .left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
  .btn .label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.35;
  }
  .btn .label .ar {
    font-weight: 700;
    font-size: 14.5px;
  }
  .btn .label .en {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    opacity: 0.85;
  }
  .btn .chevron {
    opacity: 0.85;
  }
  .btn-whatsapp { background: #22B457; color: #fff; }
  .btn-call { background: #2E6FE0; color: #fff; }
  .btn-insta {
    background: #F5F7FA;
    color: var(--ink);
    border: 1px solid #E7EBF2;
  }
  .btn-save { background: var(--navy-deep); color: #fff; margin-top: 4px; }
  .footer {
    text-align: center;
    padding: 18px 20px 26px;
  }
  .footer .ar {
    font-size: 12px;
    color: var(--ink);
  }
  .footer .en {
    font-family: 'Poppins', sans-serif;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-top: 4px;
  }
  .footer .bar {
    height: 3px;
    width: 50px;
    margin: 10px auto 0;
    border-radius: 3px;
    background: var(--grad);
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-deep);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
